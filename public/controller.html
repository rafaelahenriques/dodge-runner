<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controller</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1 class="controller-title">Controller</h1>
<p>Tilt your phone to control the ball on the desktop.</p>
<button id="permissionBtn">Enable Motion</button>
<button id="restartBtn" style="display:none">RESTART</button>
<button id="musicBtn" style="display:none">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
    <path id="iconPath" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
  </svg>
</button>
<span id="status">not connected</span>
<span id="tiltDisplay">β: 0 | γ: 0</span>
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/simple-peer/simplepeer.min.js"></script>
<script>
  const $status        = document.getElementById('status');
  const $tiltDisplay   = document.getElementById('tiltDisplay');
  const $permissionBtn = document.getElementById('permissionBtn');
  const $restartBtn    = document.getElementById('restartBtn');
  const $musicBtn      = document.getElementById('musicBtn');

  const getUrlParam = name => {
    const regex = new RegExp(`[?&]${name}=([^&#]*)`);
    const result = regex.exec(location.search);
    return result ? decodeURIComponent(result[1]) : null;
  };

  const init = () => {
    const targetId = getUrlParam('id');
    if (!targetId) {
      $status.textContent = 'missing ?id — scan QR again';
      return;
    }

    const socket = io.connect('/');
    let peer;
    let musicPlaying = true;

    socket.on('connect', () => {
      peer = new SimplePeer({ initiator: true, trickle: true });

      peer.on('signal', data => {
        socket.emit('signal', targetId, data);
      });

      socket.on('signal', (myId, data) => {
        peer.signal(data);
      });

      peer.on('connect', () => {
        $status.textContent = 'connected ✓';
      });

      peer.on('data', data => {
        const msg = JSON.parse(data);
        if (msg.type === 'showRestart') {
          $restartBtn.style.display = 'block';
        } else if (msg.type === 'gameStarted') {
          $musicBtn.style.display = 'block';
        } else if (msg.type === 'musicResumed') {
  musicPlaying = true;
  document.getElementById('iconPath').setAttribute('d', 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z');
} else if (msg.type === 'hit') {
          window.navigator.vibrate?.(200);
          document.body.style.background = '#e94560';
          setTimeout(() => document.body.style.background = '', 200);
        }
      });

      peer.on('error', err => console.error(err));
    });

    $restartBtn.addEventListener('click', () => {
      peer.send(JSON.stringify({ type: 'restart' }));
      $restartBtn.style.display = 'none';
    });

  $musicBtn.addEventListener('click', () => {
  musicPlaying = !musicPlaying;
  peer.send(JSON.stringify({ type: musicPlaying ? 'musicPlay' : 'musicPause' }));
  document.getElementById('iconPath').setAttribute('d',
    musicPlaying
      ? 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z'
      : 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM11 4L9 6 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3z'
  );
});

    $permissionBtn.addEventListener('click', async () => {
      if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== 'granted') {
          $status.textContent = 'motion permission denied';
          return;
        }
      }
      window.addEventListener('deviceorientation', ({ beta, gamma }) => {
        if (!peer || !peer.connected) return;
        peer.send(JSON.stringify({ type: 'tilt', beta: Math.round(beta), gamma: Math.round(gamma) }));
        $tiltDisplay.textContent = `β: ${Math.round(beta)} | γ: ${Math.round(gamma)}`;
      });
      $permissionBtn.style.display = 'none';
      peer.send(JSON.stringify({ type: 'motionReady' }));
    });
  };

  init();
</script>
</body>
</html>
