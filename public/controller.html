<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controller</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1 class="controller-title">Controller</h1>
<p>Tilt your phone to control the ball on the desktop.</p>
<button id="permissionBtn">Enable Motion</button>
<button id="restartBtn" style="display:none">RESTART</button>
<span id="status">not connected</span>
<span id="tiltDisplay">β: 0 | γ: 0</span>
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/simple-peer/simplepeer.min.js"></script>
<script>
  const $status        = document.getElementById('status');
  const $tiltDisplay   = document.getElementById('tiltDisplay');
  const $permissionBtn = document.getElementById('permissionBtn');
  const $restartBtn    = document.getElementById('restartBtn');

  const getUrlParam = name => {
    const regex = new RegExp(`[?&]${name}=([^&#]*)`);
    const result = regex.exec(location.search);
    return result ? decodeURIComponent(result[1]) : null;
  };

  const init = () => {
    const targetId = getUrlParam('id');
    if (!targetId) {
      $status.textContent = 'missing ?id — scan QR again';
      return;
    }

    const socket = io.connect('/');
    let peer;

    socket.on('connect', () => {
      peer = new SimplePeer({ initiator: true, trickle: true });

      peer.on('signal', data => {
        socket.emit('signal', targetId, data);
      });

      socket.on('signal', (myId, data) => {
        peer.signal(data);
      });

      peer.on('connect', () => {
        $status.textContent = 'connected ✓';
      });

      peer.on('data', data => {
        const msg = JSON.parse(data);
       if (msg.type === 'showRestart') {
  $restartBtn.style.display = 'block';
} else if (msg.type === 'hit') {
  window.navigator.vibrate?.(200);
  document.body.style.background = '#e94560';
  setTimeout(() => document.body.style.background = '', 200);
}
      });

      peer.on('error', err => console.error(err));
    });

    $restartBtn.addEventListener('click', () => {
      peer.send(JSON.stringify({ type: 'restart' }));
      $restartBtn.style.display = 'none';
    });

    $permissionBtn.addEventListener('click', async () => {
      if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== 'granted') {
          $status.textContent = 'motion permission denied';
          return;
        }
      }
      window.addEventListener('deviceorientation', ({ beta, gamma }) => {
        if (!peer || !peer.connected) return;
        peer.send(JSON.stringify({ type: 'tilt', beta: Math.round(beta), gamma: Math.round(gamma) }));
        $tiltDisplay.textContent = `β: ${Math.round(beta)} | γ: ${Math.round(gamma)}`;
      });
      $permissionBtn.style.display = 'none';
      peer.send(JSON.stringify({ type: 'motionReady' }));
    });
  };

  init();
</script>
</body>
</html>
