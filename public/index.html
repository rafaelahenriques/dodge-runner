<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance Game</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0f0f0f;
  color: #fff;
  font-family: sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
}
#setup {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}
#setup p { opacity: 0.5; font-size: 0.9rem; }
canvas {
  display: none;
  border: 2px solid #333;
  border-radius: 8px;
}
#status {
  position: absolute;
  top: 1rem;
  font-size: 0.85rem;
  opacity: 0.4;
}
</style>
</head>
<body>
<span id="status">waiting for controller...</span>
<div id="setup">
  <p>Scan to connect your phone</p>
  <div id="qr"></div>
  <a id="url" href=""></a>
</div>
<canvas id="gameCanvas" width="600" height="600"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
  integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw=="
  crossorigin="anonymous"></script>
<script src="https://unpkg.com/simple-peer/simplepeer.min.js"></script>
<script>
  const $status  = document.getElementById('status');
  const $setup   = document.getElementById('setup');
  const $canvas  = document.getElementById('gameCanvas');
  const $qr      = document.getElementById('qr');
  const $url     = document.getElementById('url');
  const ctx      = $canvas.getContext('2d');

  const ball = { x: 300, y: 540, vx: 0, vy: 0 };
  const laneX = [100, 300, 500];
  let obstacles = [];
  let tiltX = 0;
  let tiltY = 0;

  // --- Game ---
  const spawnObstacle = () => {
    const lane = Math.floor(Math.random() * 3);
    obstacles.push({
      x: laneX[lane] - 30,
      y: -60,
      width: 60,
      height: 30,
      speed: 3
    });
  };

  const startGame = () => {
    ball.x = 300;
    ball.y = $canvas.height - 60;
    ball.vx = 0;
    ball.vy = 0;
    setInterval(spawnObstacle, 1500);
    requestAnimationFrame(gameLoop);
  };

  const gameLoop = () => {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  };

  const update = () => {
    ball.vx += tiltX * 0.3;
    ball.vx *= 0.95;
    ball.x += ball.vx;
    ball.x = Math.max(100, Math.min(500, ball.x));
    ball.y = $canvas.height - 60;
    obstacles.forEach(ob => ob.y += ob.speed);
    obstacles = obstacles.filter(ob => ob.y < $canvas.height);
  };

  const draw = () => {
    ctx.clearRect(0, 0, $canvas.width, $canvas.height);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, $canvas.width, $canvas.height);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(200, 0);
    ctx.lineTo(200, $canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(400, 0);
    ctx.lineTo(400, $canvas.height);
    ctx.stroke();
    ctx.fillStyle = '#f5a623';
    obstacles.forEach(ob => ctx.fillRect(ob.x, ob.y, ob.width, ob.height));
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 20, 0, Math.PI * 2);
    ctx.fillStyle = '#e94560';
    ctx.fill();
  };

  // --- Socket + SimplePeer ---
  const socket = io.connect('/');
  let peer;

  socket.on('connect', () => {
    const url = `${new URL(`/controller.html?id=${socket.id}`, window.location)}`;
    $url.textContent = url;
    $url.setAttribute('href', url);
    const qr = qrcode(4, 'L');
    qr.addData(url);
    qr.make();
    $qr.innerHTML = qr.createImgTag(4);
  });

  socket.on('signal', (myId, data, controllerId) => {
    if (!peer) {
      peer = new SimplePeer({ initiator: false, trickle: true });

      peer.on('signal', data => {
        socket.emit('signal', controllerId, data);
      });

      peer.on('connect', () => {
        $status.textContent = 'controller connected ✓';
        $setup.style.display = 'none';
        $canvas.style.display = 'block';
        startGame();
      });

      peer.on('data', data => {
        const { beta, gamma } = JSON.parse(data);
        tiltY = beta  ?? 0;
        tiltX = gamma ?? 0;
      });

      peer.on('error', err => console.error(err));
    }

    peer.signal(data);
  });
</script>
</body>
</html>
