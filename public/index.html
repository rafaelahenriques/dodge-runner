<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance Game</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<span id="status">waiting for controller...</span>
<div id="setup">
  <h1 class="game-title">DODGE<span>RUNNER</span></h1>
  <p>Scan to connect your phone</p>
  <div id="qr"></div>
  <a id="url" href=""></a>
</div>

<canvas id="gameCanvas" width="600" height="600"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
  integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw=="
  crossorigin="anonymous"></script>
<script src="https://unpkg.com/simple-peer/simplepeer.min.js"></script>
<script>
  const $status  = document.getElementById('status');
  const $setup   = document.getElementById('setup');
  const $canvas  = document.getElementById('gameCanvas');
  const $qr      = document.getElementById('qr');
  const $url     = document.getElementById('url');
  const ctx      = $canvas.getContext('2d');

  const ball = { x: 300, y: 540, vx: 0, vy: 0 };
  const laneX = [100, 300, 500];
  let obstacles = [];
  let tiltX = 0;
  let tiltY = 0;
  let gameOver = false;
  let score = 0;
  let lives = 3;
  let gameOverTimer = 0;
  const GAME_OVER_DURATION = 180;

  // --- Audio ---
  const collisionSound = new Audio('/collision.mp3');
  let audioUnlocked = false;

  const unlockAudio = () => {
    collisionSound.play().then(() => {
      collisionSound.pause();
      collisionSound.currentTime = 0;
      audioUnlocked = true;
    }).catch(() => {});
    document.removeEventListener('click', unlockAudio);
  };

  document.addEventListener('click', unlockAudio);

  // --- Collision ---
  const circleHitsRect = (ball, ob) => {
    const closestX = Math.max(ob.x, Math.min(ball.x, ob.x + ob.width));
    const closestY = Math.max(ob.y, Math.min(ball.y, ob.y + ob.height));
    const dx = ball.x - closestX;
    const dy = ball.y - closestY;
    return (dx * dx + dy * dy) < (20 * 20);
  };

  // --- Game ---
  const spawnObstacle = () => {
    if (gameOver) return;
    const lane = Math.floor(Math.random() * 3);
    obstacles.push({
      x: laneX[lane] - 30,
      y: -60,
      width: 60,
      height: 30,
      speed: 3,
      hit: false
    });
  };

  const resetGame = () => {
    ball.x = 300;
    ball.y = $canvas.height - 60;
    ball.vx = 0;
    ball.vy = 0;
    obstacles = [];
    score = 0;
    lives = 3;
    gameOver = false;
    gameOverTimer = 0;
  };

  const startGame = () => {
    resetGame();
    setInterval(spawnObstacle, 1500);
    requestAnimationFrame(gameLoop);
  };

  const gameLoop = () => {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  };

  const update = () => {
    if (gameOver) {
      gameOverTimer++;
      if (gameOverTimer > GAME_OVER_DURATION && Math.abs(tiltX) > 5) {
        resetGame();
      }
      return;
    }

    ball.vx += tiltX * 0.3;
    ball.vx *= 0.95;
    ball.x += ball.vx;
    ball.x = Math.max(100, Math.min(500, ball.x));
    ball.y = $canvas.height - 60;

    obstacles.forEach(ob => ob.y += ob.speed);
    obstacles = obstacles.filter(ob => ob.y < $canvas.height);

    score++;

    obstacles.forEach(ob => {
      if (!ob.hit && circleHitsRect(ball, ob)) {
        ob.hit = true;
        collisionSound.currentTime = 0;
        collisionSound.play();
        lives--;
        if (lives <= 0) {
          gameOver = true;
          gameOverTimer = 0;
        }
      }
    });
  };

 const draw = () => {
    ctx.clearRect(0, 0, $canvas.width, $canvas.height);

    // Background
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, $canvas.width, $canvas.height);

    // Scanline effect
    for (let y = 0; y < $canvas.height; y += 4) {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(0, y, $canvas.width, 2);
    }

    // Lane backgrounds
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(0, 0, 200, $canvas.height);
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(200, 0, 200, $canvas.height);
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(400, 0, 200, $canvas.height);

    // Lane dividers with glow
    ctx.strokeStyle = 'rgba(0,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(200, 0);
    ctx.lineTo(200, $canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(400, 0);
    ctx.lineTo(400, $canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);

    // Obstacles
    obstacles.forEach(ob => {
      const color = ob.hit ? '#e94560' : '#f5a623';
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      ctx.fillStyle = color;
      ctx.fillRect(ob.x, ob.y, ob.width, ob.height);
      // pixel border
      ctx.strokeStyle = ob.hit ? '#ff8fa3' : '#ffd580';
      ctx.lineWidth = 2;
      ctx.strokeRect(ob.x, ob.y, ob.width, ob.height);
      ctx.shadowBlur = 0;
    });

    // Ball with glow
    ctx.shadowColor = '#e94560';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#e94560';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Ball highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(ball.x - 6, ball.y - 6, 6, 0, Math.PI * 2);
    ctx.fill();

    // Score and lives
    ctx.font = '12px "Press Start 2P", monospace';
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 8;
    ctx.fillText(`SCORE  ${Math.floor(score / 60)}`, 10, 24);
    ctx.fillText(`LIVES  ${'♥ '.repeat(lives)}`, 10, 48);
    ctx.shadowBlur = 0;

    // Game over screen
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, 0, $canvas.width, $canvas.height);

      ctx.font = 'bold 24px "Press Start 2P", monospace';
      ctx.fillStyle = '#e94560';
      ctx.shadowColor = '#e94560';
      ctx.shadowBlur = 20;
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', $canvas.width / 2, $canvas.height / 2 - 30);

      ctx.font = '14px "Press Start 2P", monospace';
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 0;
      ctx.fillText(`SCORE  ${Math.floor(score / 60)}`, $canvas.width / 2, $canvas.height / 2 + 10);

      if (gameOverTimer > GAME_OVER_DURATION) {
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillStyle = '#0ff';
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur = 8;
        ctx.fillText('TILT TO RESTART', $canvas.width / 2, $canvas.height / 2 + 50);
        ctx.shadowBlur = 0;
      }
      ctx.textAlign = 'left';
    }
  };

  // --- Socket + SimplePeer ---
  const socket = io.connect('/');
  let peer;

  socket.on('connect', () => {
    const url = `${new URL(`/controller.html?id=${socket.id}`, window.location)}`;
    $url.textContent = url;
    $url.setAttribute('href', url);
    const qr = qrcode(4, 'L');
    qr.addData(url);
    qr.make();
    $qr.innerHTML = qr.createImgTag(4);
  });

  socket.on('signal', (myId, data, controllerId) => {
    if (!peer) {
      peer = new SimplePeer({ initiator: false, trickle: true });

      peer.on('signal', data => {
        socket.emit('signal', controllerId, data);
      });

      peer.on('connect', () => {
        $status.textContent = 'controller connected ✓';
        $setup.style.display = 'none';
        $canvas.style.display = 'block';
        startGame();
      });

      peer.on('data', data => {
        const { beta, gamma } = JSON.parse(data);
        tiltY = beta  ?? 0;
        tiltX = gamma ?? 0;
      });

      peer.on('error', err => console.error(err));
    }

    peer.signal(data);
  });
</script>
</body>
</html>
